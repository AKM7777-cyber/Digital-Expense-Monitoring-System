<!DOCTYPE html>
<html>
<head>
    <title>Expense Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        /* NAVBAR */
        .navbar {
            background: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
        }

        /* CONTAINER */
        .container {
            padding: 30px;
        }

        /* CARDS */
        .cards {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card h2 {
            margin: 0;
            color: #2c3e50;
        }

        .card p {
            font-size: 20px;
            color: #27ae60;
        }

        /* BUTTONS */
        .actions {
            text-align: center;
            margin-bottom: 30px;
        }

        .btn {
            padding: 12px 20px;
            margin: 10px;
            border: none;
            border-radius: 6px;
            background: #3498db;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .btn:hover {
            background: #2980b9;
        }

        /* TABLE */
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 12px;
            text-align: center;
        }

        th {
            background: #2c3e50;
            color: white;
        }

        tr:nth-child(even) {
            background: #f2f2f2;
        }

        .action-btn {
            background: #e74c3c;
            padding: 5px 10px;
            border: none;
            color: white;
            border-radius: 4px;
        }

        .edit-btn {
            background: #27ae60;
        }

    </style>
</head>

<body>

    <div class="navbar">
        Digital Expense Monitoring System
    </div>

    <div class="container">

        <!-- DASHBOARD CARDS -->
        <div class="cards">
            <div class="card">
                <h2>Total Expense</h2>
                <p>₹5000</p>
            </div>
            <div class="card">
                <h2>Budget Remaining</h2>
                <p>₹2000</p>
            </div>
        </div>

        <!-- ACTION BUTTONS -->
        <div class="actions">
            <button class="btn">Add Expense</button>
            <button class="btn">View Reports</button>
        </div>

        <!-- EXPENSE TABLE -->
        <table>
            <tr>
                <th>Date</th>
                <th>Category</th>
                <th>Amount</th>
                <th>Actions</th>
            </tr>
            <tr>
                <td>25 Mar</td>
                <td>Food</td>
                <td>₹200</td>
                <td>
                    <button class="action-btn edit-btn">Edit</button>
                    <button class="action-btn">Delete</button>
                </td>
            </tr>
            <tr>
                <td>24 Mar</td>
                <td>Transport</td>
                <td>₹100</td>
                <td>
                    <button class="action-btn edit-btn">Edit</button>
                    <button class="action-btn">Delete</button>
                </td>
            </tr>
        </table>

    </div>

</body>
</html>
